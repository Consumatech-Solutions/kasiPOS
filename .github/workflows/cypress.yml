name: Cypress E2E

on:
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Next.js dev server
        env:
          # Must match Cypress `API_BASE_URL` and `cypress/support/mocks.ts` intercepts.
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run dev &

      - name: Wait for app
        run: npx wait-on http://127.0.0.1:9002

      - name: Run Cypress
        env:
          CI: true
          API_BASE_URL: http://localhost:3000
        run: npm run cypress:run

      - name: Upload Cypress screenshots (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
